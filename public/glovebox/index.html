<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glovebox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      var stored = localStorage.getItem("glovebox-theme");
      if (stored === "light" || stored === "dark") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <button
          type="button"
          id="nav-toggle"
          class="chip icon-button nav-toggle"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="side-nav"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <a href="#/log" class="wordmark">Glovebox</a>
      </div>

      <div class="account header-controls">
        <button
          type="button"
          id="theme-toggle"
          class="chip icon-button"
          role="switch"
          aria-checked="false"
          aria-label="Switch to dark mode"
        >
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 1020.354 15.354z"/></svg>
        </button>

        <button
          type="button"
          id="units-toggle"
          class="chip units-chip"
          role="switch"
          aria-checked="false"
          aria-label="Switch to kilometers and liters"
        >MI</button>

        <button
          type="button"
          id="account-chip"
          class="chip"
          aria-haspopup="true"
          aria-expanded="false"
          aria-label="Show logged-in account"
          hidden
        ></button>
        <div id="account-popover" class="popover" role="tooltip" hidden></div>
      </div>
    </header>

    <div class="app-body">
      <nav class="side-nav" id="side-nav" aria-label="Sections">
        <a href="#/ask" class="nav-item" data-route="#/ask">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
          <span class="nav-label">Ask</span>
        </a>
        <a href="#/log" class="nav-item" data-route="#/log">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="22" x2="15" y2="22"/><line x1="4" y1="9" x2="14" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>
          <span class="nav-label">Fuel &amp; Charging</span>
        </a>
        <a href="#/maintenance" class="nav-item" data-route="#/maintenance">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          <span class="nav-label">Maintenance</span>
        </a>
        <a href="#/insurance" class="nav-item" data-route="#/insurance">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          <span class="nav-label">Insurance</span>
        </a>
        <a href="#/vehicle" class="nav-item nav-item-vehicle" data-route="#/vehicle">
          <svg class="nav-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C1.4 11.3 1 12.1 1 13v3c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg>
          <span class="nav-label">
            <span>Vehicle Information</span>
            <span class="nav-subtext" id="nav-vehicle-name" hidden></span>
          </span>
        </a>
      </nav>
      <div class="nav-scrim" id="nav-scrim" hidden></div>

      <main class="app-main">
        <section class="route" id="route-log" data-route="#/log">
          <section class="card dash-card">
            <div class="dash-label" id="dash-label">Average Efficiency</div>
            <div id="dash-value"></div>
            <div id="dash-sub" class="dash-sub"></div>
          </section>

          <div class="segment" role="tablist" aria-label="Log type">
            <button type="button" class="segment-btn active" id="seg-gas" role="tab" aria-selected="true" aria-controls="panel-gas" tabindex="0" data-panel="panel-gas">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="22" x2="15" y2="22"/><line x1="4" y1="9" x2="14" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>
              Gas
            </button>
            <button type="button" class="segment-btn" id="seg-ev" role="tab" aria-selected="false" aria-controls="panel-ev" tabindex="-1" data-panel="panel-ev">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              Charge
            </button>
          </div>

          <div class="log-panel" id="panel-gas" role="tabpanel" aria-labelledby="seg-gas" tabindex="0">

          <section class="card">
            <h2 id="fuel-form-title">Log a Fill-up</h2>
            <form id="entry-form">
              <div class="field">
                <label for="date">Date</label>
                <div class="date-field-wrap">
                  <input type="date" id="date" name="date" />
                  <span id="date-display" class="date-display" aria-hidden="true"></span>
                </div>
              </div>

              <div class="field">
                <label for="odometer" id="odometer-label">Odometer (mi)</label>
                <input type="number" id="odometer" name="odometer" min="0" step="1" required inputmode="numeric" placeholder="e.g. 65,300" />
              </div>

              <div class="field">
                <label for="volume" id="volume-label">Gallons</label>
                <input type="number" id="volume" name="volume" min="0" step="0.001" required inputmode="decimal" placeholder="e.g. 9.5" />
              </div>

              <div class="field">
                <label for="notes">Notes (optional)</label>
                <textarea id="notes" name="notes" rows="2"></textarea>
              </div>

              <button type="submit">Add Entry</button>
              <button type="button" id="entry-cancel" class="btn-secondary" hidden>Cancel</button>
              <p id="form-error" class="error" role="alert" aria-live="polite" hidden></p>
            </form>
          </section>

          <section class="card">
            <h2>History</h2>
            <ul id="history-list" class="history-list">
              <li class="history-empty">Loading...</li>
            </ul>
          </section>

          </div><!-- /panel-gas -->

          <div class="log-panel" id="panel-ev" role="tabpanel" aria-labelledby="seg-ev" tabindex="0" hidden>
            <section class="card">
              <h2 id="charge-form-title">Log a Charge</h2>
              <form id="charge-form">
                <div class="field">
                  <label for="charge-date">Date</label>
                  <div class="date-field-wrap">
                    <input type="date" id="charge-date" name="date" />
                    <span id="charge-date-display" class="date-display" aria-hidden="true"></span>
                  </div>
                </div>

                <div class="field">
                  <label for="charge-odometer" id="charge-odo-label">Odometer (mi)</label>
                  <input type="number" id="charge-odometer" name="odometer" min="0" step="1" required inputmode="numeric" placeholder="e.g. 65,300" />
                </div>

                <div class="field">
                  <label for="charge-kwh">kWh delivered</label>
                  <input type="number" id="charge-kwh" name="kwh" min="0" step="0.01" required inputmode="decimal" placeholder="e.g. 8.4" />
                </div>

                <div class="field">
                  <label for="charge-miles" id="charge-miles-label">Miles added (optional)</label>
                  <span class="field-hint">From ChargePoint or your charger's estimate</span>
                  <input type="number" id="charge-miles" name="miles_added" min="0" step="1" inputmode="numeric" placeholder="e.g. 30" />
                </div>

                <div class="field">
                  <label for="charge-notes">Notes (optional)</label>
                  <textarea id="charge-notes" name="notes" rows="2"></textarea>
                </div>

                <button type="submit">Add Charge</button>
                <button type="button" id="charge-cancel" class="btn-secondary" hidden>Cancel</button>
                <p id="charge-form-error" class="error" role="alert" aria-live="polite" hidden></p>
              </form>
            </section>

            <section class="card">
              <h2>History</h2>
              <ul id="charge-list" class="history-list">
                <li class="history-empty">Loading…</li>
              </ul>
            </section>
          </div><!-- /panel-ev -->
        </section>

        <section class="route" id="route-maintenance" data-route="#/maintenance" hidden>
          <section class="card">
            <div class="card-head">
              <h2>Maintenance</h2>
              <button type="button" id="maint-add-btn" class="btn-secondary">Add service</button>
            </div>
            <div id="maint-form-wrap" hidden></div>
            <ul id="maint-list" class="history-list">
              <li class="history-empty">Loading…</li>
            </ul>
          </section>
        </section>

        <section class="route" id="route-insurance" data-route="#/insurance" hidden>
          <section class="card">
            <div id="insurance-body">
              <p class="placeholder-note">Loading…</p>
            </div>
          </section>
        </section>

        <section class="route" id="route-vehicle" data-route="#/vehicle" hidden>
          <section class="card">
            <p class="placeholder-note">Loading…</p>
          </section>
        </section>

        <section class="route" id="route-ask" data-route="#/ask" hidden>
          <section class="card ask-card">
            <div class="ask-log" id="ask-log"></div>
            <!-- Screen-reader status: announces "Thinking…" and the new reply only,
                 instead of re-reading the whole transcript on every render. -->
            <div id="ask-status" class="sr-only" aria-live="polite"></div>
            <form class="ask-form" id="ask-form">
              <textarea
                id="ask-input"
                class="ask-input"
                rows="1"
                placeholder="e.g. When is my next oil change due?"
                aria-label="Ask a question about your car"
              ></textarea>
              <button type="submit" id="ask-send" class="ask-send" aria-label="Send">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              </button>
            </form>
            <p id="ask-error" class="error" role="alert" hidden></p>
          </section>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
